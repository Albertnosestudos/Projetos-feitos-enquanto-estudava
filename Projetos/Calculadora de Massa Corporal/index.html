<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Massa Corporal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading"> Calculadora de Massa Corporal (CMC)</h1>
        Sua Altura (cm):    
        <input type="number" class="input" id="altura" value="180" placeholder="Coloque aqui sua altura">
        Seu peso (kg):    
        <input type="number" class="input" id="peso" value="180" placeholder="Coloque aqui seu peso">
        <button class="btn" id="btn"> Calcule CMC</button>
        <input disabled type="number" class="input" id="resultado-CMC">
        <h4 class="info">Condiçao de Peso: <span id="condicaoDePeso"></span></h4>

    </div>

    <script src="index.js"></script>
</body>
</html>
